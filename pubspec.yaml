name: bloc_plus
description: "Async helpers for Cubits, one-off effects kept out of the state, rebuild conditions and widgets that hand the bloc to callbacks, for flutter_bloc."
version: 1.0.0
repository: "https://github.com/ephmoc/bloc_plus"
topics:
  - flutter
  - bloc
  - state-management
  - effects
  - async

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ">=9.0.0 <10.0.0"
  bloc: ">=9.2.1 <10.0.0"
  provider: ">=6.0.0 <7.0.0"
  meta: ">=1.9.1 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
