version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Library: root pubspec.lock is not committed, so PRs appear only when a new
  # release falls outside the declared ranges (e.g. flutter_bloc 10).
  # widen never raises a lower bound: ">=9.0.0 <10.0.0" becomes ">=9.0.0 <11.0.0".
  # Such a PR changes pubspec.yaml, so the CHANGELOG gate asks for an entry.
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    versioning-strategy: widen
    schedule:
      interval: weekly

  - package-ecosystem: pub
    directory: /example
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      example:
        patterns: ['*']
