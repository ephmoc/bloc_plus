# Release pipeline. Pushing a tag vX.Y.Z that points to a commit on main runs
# verify -> publish to pub.dev with GitHub's OIDC token (no stored
# credentials) -> GitHub Release. A manual run only builds and checks the
# package archive. Setup and release steps: AGENTS.md, "Release Process".
# Actions here are pinned to commit SHAs because this path can publish;
# Dependabot updates the pins.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag, version, CHANGELOG, branch and CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag equals pubspec version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pubspec_version=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if [ "$tag_version" != "$pubspec_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version."
            exit 1
          fi

      - name: CHANGELOG has a section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Exact heading: '## 0.2.1' must not match '## 0.2.10'.
          if ! awk -v h="## $version" '$0 == h || index($0, h " ") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main."
            exit 1
          fi

      # The squash commit on main is tested by the push run of ci.yml, not by
      # the PR run, and release.yml does not wait for it.
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-gate" \
            -q '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::ci-gate has not passed on $GITHUB_SHA. Wait for CI on main to finish green, then re-run this workflow."
            exit 1
          fi

  publish:
    name: Publish to pub.dev
    needs: verify
    permissions:
      contents: read
      id-token: write # OIDC token for pub.dev
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      environment: pub.dev

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG
        run: |
          awk -v h="## ${GITHUB_REF_NAME#v}" '
            $0 == h || index($0, h " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          # vX.Y.Z-dev.N must not become the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  dry-run:
    name: Build and check the package archive (no publish)
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write # requested by the reusable workflow, even in a test run
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
    with:
      test-run: true
